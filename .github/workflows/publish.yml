name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: Tag to publish, such as v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run check
      - run: bun src/self-test/run.ts
        env:
          HOST: 127.0.0.1
          HTTP_PORT: "3000"
          HTTP_SERVICE_PORT: "3001"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
          PUBLISH_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(bun -p "require('./package.json').version")"
          ref="${PUBLISH_REF#refs/tags/}"
          tag="${ref#v}"
          if [[ "${tag}" != "${version}" ]]; then
            echo "Tag ${ref} does not match package version ${version}."
            exit 1
          fi
          printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${GITHUB_TOKEN}" >> .npmrc
          if bun pm view "@veducio/keja@${version}" version >/dev/null 2>&1; then
            echo "@veducio/keja@${version} is already published."
          else
            bun publish
          fi
      - name: Publish @veducio/keja to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "Add the NPM_TOKEN secret before publishing @veducio/keja to npm."
            exit 1
          fi
          version="$(bun -p "require('./package.json').version")"
          printf '@veducio:registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > .npmrc
          bun -e 'const pkg = await Bun.file("package.json").json(); pkg.publishConfig = { registry: "https://registry.npmjs.org", access: "public" }; await Bun.write("package.json", JSON.stringify(pkg, null, 2) + "\n");'
          if bun pm view "@veducio/keja@${version}" version >/dev/null 2>&1; then
            echo "@veducio/keja@${version} is already on npm."
            exit 0
          fi
          bun publish --access public --registry https://registry.npmjs.org
