name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run check
      - run: bun src/self-test/run.ts
        env:
          HOST: 127.0.0.1
          HTTP_PORT: "3000"
          HTTP_SERVICE_PORT: "3001"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: |
          set -euo pipefail
          version="$(bun -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag}" != "${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi
          printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${GITHUB_TOKEN}" >> .npmrc
          if bun pm view "@veducio/keja@${version}" version >/dev/null 2>&1; then
            echo "@veducio/keja@${version} is already published."
            exit 0
          fi
          bun publish
