name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@veducio"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check
      - run: bun src/self-test/run.ts
        env:
          HOST: 127.0.0.1
          HTTP_PORT: "3000"
          HTTP_SERVICE_PORT: "3001"
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag}" != "${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi
          if npm view "@veducio/keja@${version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@veducio/keja@${version} is already published."
            exit 0
          fi
          npm publish
